<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Crew</title>
  <link rel="icon" href="assets/knight-orange.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. Main menu -->
  <section id="menu" class="screen">
    <div class="menu-main">
      <p class="eyebrow">Co-op · 1 to 4 players</p>
      <h1 class="title">Dungeon<br>Crew</h1>
      <p class="lead">Six floors. Six bosses. Bring your friends.</p>
      <form id="menu-form" class="menu-form" autocomplete="off">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" maxlength="12" placeholder="Name">
        <button id="create-btn" type="button" class="btn btn-primary btn-big">Create room</button>
        <div class="join-row">
          <label for="code-input" class="sr-only">Room code</label>
          <input id="code-input" type="text" maxlength="4" placeholder="Room code" class="code-input">
          <button id="join-btn" type="submit" class="btn btn-outline">Join</button>
        </div>
        <p id="menu-error" class="error" role="alert"></p>
      </form>
    </div>
    <aside class="panel how-to">
      <h2>Controls</h2>
      <ul class="keys">
        <li><kbd>W A S D</kbd><span>Move</span></li>
        <li><kbd>Click</kbd><span>Attack</span></li>
        <li><kbd>Q</kbd><span>Skill</span></li>
        <li><kbd>Space</kbd><span>Big skill</span></li>
        <li><kbd>E</kbd><span>Revive a friend (hold)</span></li>
        <li><kbd>1</kbd><span>Drink a potion</span></li>
        <li><kbd>2</kbd><span>Use a feather</span></li>
      </ul>
      <button id="menu-settings" type="button" class="btn btn-small btn-outline">Settings</button>
    </aside>
  </section>

  <!-- 2. Lobby + character select -->
  <section id="lobby" class="screen hidden">
    <header class="lobby-top">
      <h1 class="screen-title">Pick your hero</h1>
      <div class="room-code">
        <span class="muted">Room</span>
        <span id="room-code" class="code"></span>
        <button id="copy-link" type="button" class="btn btn-small btn-outline">Copy link</button>
        <button id="room-lock" type="button" class="btn btn-small btn-outline hidden" aria-pressed="false">Lock room</button>
        <button id="lobby-settings" type="button" class="btn btn-small btn-outline" aria-label="Settings">Settings</button>
      </div>
    </header>
    <div class="lobby-body">
      <div class="lobby-left">
        <div id="hero-list" class="hero-list"></div>
        <div class="panel color-panel">
          <span class="label">Your color</span>
          <div id="color-list" class="color-list"></div>
          <span id="color-note" class="muted small"></span>
        </div>
      </div>
      <div class="hero-preview panel">
        <img id="preview-img" alt="" width="240" height="240">
        <span id="preview-name" class="preview-name"></span>
      </div>
      <div class="hero-details panel">
        <p id="hero-desc" class="hero-desc"></p>
        <div id="hero-stats" class="stats"></div>
        <h2 class="label">Skills</h2>
        <div id="hero-skills" class="skills"></div>
      </div>
    </div>
    <footer class="lobby-bottom">
      <div id="team-strip" class="team-strip"></div>
      <div class="lobby-actions">
        <button id="leave-btn" type="button" class="btn btn-outline">Leave</button>
        <button id="lock-btn" type="button" class="btn btn-primary btn-big">Lock in</button>
        <button id="start-btn" type="button" class="btn btn-teal btn-big hidden">Start</button>
      </div>
      <p id="lobby-error" class="error" role="alert"></p>
    </footer>
  </section>

  <!-- Settings (music and effects), opened from the menu, lobby or pause screen -->
  <div id="settings" class="settings-overlay hidden" role="dialog" aria-label="Settings">
    <div class="panel settings-card">
      <h2>Settings</h2>
      <div id="settings-sound"></div>
      <button id="settings-close" type="button" class="btn btn-primary">Done</button>
    </div>
  </div>

  <!-- 3. The dungeon -->
  <section id="game" class="screen hidden">
    <div id="game-canvas"></div>
    <div id="hud"></div>
    <div id="results" class="results hidden" role="dialog" aria-label="Floor results"></div>
  </section>

  <!-- 4. Camp shop -->
  <section id="shop" class="screen hidden"></section>

  <!-- 5. End screen -->
  <section id="end" class="screen hidden"></section>

  <script src="config.js"></script>
  <script src="/vendor/phaser.min.js"></script>
  <script src="/shared/tiles.js"></script>
  <script src="/shared/data.js"></script>
  <script src="/shared/rooms.js"></script>
  <script src="/shared/sprites.js"></script>
  <script src="/shared/rig.js"></script>
  <script src="/shared/art/kit.js"></script>
  <script src="/shared/art/knight.js"></script>
  <script src="/shared/art/archer.js"></script>
  <script src="/shared/art/mage.js"></script>
  <script src="/shared/art/warden.js"></script>
  <script src="/shared/art/engineer.js"></script>
  <script src="/shared/art/cleric.js"></script>
  <script src="/shared/art/gloop.js"></script>
  <script src="/shared/art/bat.js"></script>
  <script src="/shared/art/bonearcher.js"></script>
  <script src="/shared/art/bones.js"></script>
  <script src="/shared/art/sporecap.js"></script>
  <script src="/shared/art/seed.js"></script>
  <script src="/shared/art/mother.js"></script>
  <script src="/shared/art/queen.js"></script>
  <script src="/shared/art/golem.js"></script>
  <script src="/shared/art/king.js"></script>
  <script src="/shared/art/dragon.js"></script>
  <script src="/shared/art/rotgrub.js"></script>
  <script src="/shared/art/slug.js"></script>
  <script src="/shared/art/wyrm.js"></script>
  <script src="/shared/art/rothand.js"></script>
  <script src="/shared/art/crawler.js"></script>
  <script src="/shared/art/wisp.js"></script>
  <script src="/shared/art/prism.js"></script>
  <script src="/shared/art/index.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="js/music.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/net.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/lobby.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/game/effects.js"></script>
  <script src="js/game/scene.js"></script>
  <script src="js/ui/results.js"></script>
  <script src="js/ui/shop.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
